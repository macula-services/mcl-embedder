<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" role="img" aria-label="mcl-embedder system context">
<title>mcl-embedder system context</title>
<style>
.t-name { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; }
.t-desc { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 12.5px; }
.t-rel { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 11.5px; paint-order: stroke; stroke-width: 4px; stroke-linejoin: round; }
.t-code { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; }
.t-type { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; }
.t-bound { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; }
.t-leg { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 12px; }
.edge { fill: none; stroke-width: 1.25; }
.edge-later { fill: none; stroke-width: 1.25; stroke-dasharray: 5 4; }
.bg { fill: #FFFFFF; }
.b-sys { fill: #F5E9CC; stroke: #A56F0A; stroke-width: 2; }
.b-per { fill: #E3EBF2; stroke: #3B5B7A; stroke-width: 1.25; }
.b-mac { fill: #E6E4EE; stroke: #5E5A78; stroke-width: 1.25; }
.b-ext { fill: #ECEFED; stroke: #8A9791; stroke-width: 1.25; }
.b-cmp { fill: #FFFFFF; stroke: #8A9791; stroke-width: 1.25; }
.b-later { fill: none; stroke: #8A9791; stroke-width: 1.25; stroke-dasharray: 5 4; }
.bound { fill: none; stroke: #B3BDB8; stroke-width: 1; }
.head { fill: #3B5B7A; }
.t-name, .t-code { fill: #16201D; }
.t-type, .t-bound, .t-leg { fill: #66736E; }
.t-desc { fill: #34413C; }
.t-rel { fill: #66736E; stroke: #FFFFFF; }
.edge, .edge-later { stroke: #8A9791; }
.arrowhead { fill: #8A9791; }
@media (prefers-color-scheme: dark) {
.bg { fill: #171F1C; }
.b-sys { fill: #3A2E13; stroke: #E3AA3C; }
.b-per { fill: #1D2A36; stroke: #8EB4D8; }
.b-mac { fill: #26243A; stroke: #A9A4C8; }
.b-ext { fill: #1C2421; stroke: #7D8B85; }
.b-cmp { fill: #171F1C; stroke: #7D8B85; }
.b-later { stroke: #7D8B85; }
.bound { stroke: #4A5752; }
.head { fill: #8EB4D8; }
.t-name, .t-code { fill: #E6ECE9; }
.t-type, .t-bound, .t-leg { fill: #93A09A; }
.t-desc { fill: #C3CDC8; }
.t-rel { fill: #93A09A; stroke: #171F1C; }
.edge, .edge-later { stroke: #7D8B85; }
.arrowhead { fill: #7D8B85; }
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" x="0" y="0" width="1000" height="660"/>
<rect class="b-per" x="40" y="30" width="270" height="120" rx="10"/>
<circle class="head" cx="66" cy="54" r="9"/>
<text class="t-name" x="84" y="58">Mesh caller</text>
<text class="t-type" x="84" y="76">[Person]</text>
<text class="t-desc" x="56" y="100">A service or agent that cannot</text>
<text class="t-desc" x="56" y="116">run the ONNX model itself;</text>
<text class="t-desc" x="56" y="132">mcl-rag's embed provider is one</text>
<rect class="b-per" x="690" y="30" width="270" height="120" rx="10"/>
<circle class="head" cx="716" cy="54" r="9"/>
<text class="t-name" x="734" y="58">Service operator</text>
<text class="t-type" x="734" y="76">[Person]</text>
<text class="t-desc" x="706" y="100">Runs it on an AVX2 host and</text>
<text class="t-desc" x="706" y="116">supplies the realm, the pinned</text>
<text class="t-desc" x="706" y="132">seeds and the health port</text>
<rect class="b-sys" x="365" y="186" width="300" height="152" rx="10"/>
<text class="t-name" x="381" y="214">mcl-embedder</text>
<text class="t-type" x="381" y="232">[mcl_om mesh service, own box]</text>
<text class="t-desc" x="381" y="256">mcl-embedder/embed is its own procedure.</text>
<text class="t-desc" x="381" y="272">mcl_om adds info and get_limits, both</text>
<text class="t-desc" x="381" y="288">open. capabilities/0 is the list.</text>
<text class="t-desc" x="381" y="304">/health is on 8480; text in, vectors out</text>
<rect class="b-mac" x="40" y="400" width="270" height="120" rx="10"/>
<text class="t-name" x="56" y="428">macula-realm</text>
<text class="t-type" x="56" y="446">[Macula infrastructure]</text>
<text class="t-desc" x="56" y="470">Admits the node, and grants the</text>
<text class="t-desc" x="56" y="486">D25 provider authorizations its</text>
<text class="t-desc" x="56" y="502">org procedures need</text>
<rect class="b-mac" x="365" y="400" width="270" height="120" rx="10"/>
<text class="t-name" x="381" y="428">Macula stations, mesh DHT</text>
<text class="t-type" x="381" y="446">[Macula infrastructure]</text>
<text class="t-desc" x="381" y="470">The pinned seeds are its entry</text>
<text class="t-desc" x="381" y="486">points (QUIC); the mesh DHT</text>
<text class="t-desc" x="381" y="502">carries what it publishes</text>
<path class="edge" d="M175 150V168H420V186" marker-end="url(#a)"/>
<text class="t-rel" x="183" y="160">calls mcl-embedder/embed,</text>
<text class="t-rel" x="183" y="176">and waits for the reply</text>
<path class="edge" d="M825 150V168H580V186" marker-end="url(#a)"/>
<text class="t-rel" x="690" y="160">deploys; sets the env</text>
<path class="edge" d="M420 338V400" marker-end="url(#a)"/>
<text class="t-rel" x="428" y="362">boot claim, provider grant</text>
<path class="edge" d="M580 338V360H600V400" marker-end="url(#a)"/>
<text class="t-rel" x="608" y="354">advertises on the DHT</text>
<text class="t-desc" x="40" y="566">It talks to nothing outside the mesh at runtime: the ONNX model and its weights are</text>
<text class="t-desc" x="40" y="584">baked into the image at build time, so a container never downloads them.</text>
<rect class="b-sys" x="24" y="620" width="22" height="14" rx="3"/>
<text class="t-leg" x="54" y="632">In scope</text>
<rect class="b-per" x="110.8" y="620" width="22" height="14" rx="3"/>
<text class="t-leg" x="140.8" y="632">Person</text>
<rect class="b-mac" x="184.39999999999998" y="620" width="22" height="14" rx="3"/>
<text class="t-leg" x="214.39999999999998" y="632">Macula infrastructure</text>
<rect class="b-ext" x="357.0" y="620" width="22" height="14" rx="3"/>
<text class="t-leg" x="387.0" y="632">External system</text>
<rect class="b-cmp" x="490.0" y="620" width="22" height="14" rx="3"/>
<text class="t-leg" x="520.0" y="632">Container or component</text>
</svg>
