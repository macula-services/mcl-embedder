<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 840" role="img" aria-label="mcl-embedder components">
<title>mcl-embedder components</title>
<style>
.t-name { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; }
.t-desc { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 12.5px; }
.t-rel { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 11.5px; paint-order: stroke; stroke-width: 4px; stroke-linejoin: round; }
.t-code { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; }
.t-type { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; }
.t-bound { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; }
.t-leg { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 12px; }
.edge { fill: none; stroke-width: 1.25; }
.edge-later { fill: none; stroke-width: 1.25; stroke-dasharray: 5 4; }
.bg { fill: #FFFFFF; }
.b-sys { fill: #F5E9CC; stroke: #A56F0A; stroke-width: 2; }
.b-per { fill: #E3EBF2; stroke: #3B5B7A; stroke-width: 1.25; }
.b-mac { fill: #E6E4EE; stroke: #5E5A78; stroke-width: 1.25; }
.b-ext { fill: #ECEFED; stroke: #8A9791; stroke-width: 1.25; }
.b-cmp { fill: #FFFFFF; stroke: #8A9791; stroke-width: 1.25; }
.b-later { fill: none; stroke: #8A9791; stroke-width: 1.25; stroke-dasharray: 5 4; }
.bound { fill: none; stroke: #B3BDB8; stroke-width: 1; }
.head { fill: #3B5B7A; }
.t-name, .t-code { fill: #16201D; }
.t-type, .t-bound, .t-leg { fill: #66736E; }
.t-desc { fill: #34413C; }
.t-rel { fill: #66736E; stroke: #FFFFFF; }
.edge, .edge-later { stroke: #8A9791; }
.arrowhead { fill: #8A9791; }
@media (prefers-color-scheme: dark) {
.bg { fill: #171F1C; }
.b-sys { fill: #3A2E13; stroke: #E3AA3C; }
.b-per { fill: #1D2A36; stroke: #8EB4D8; }
.b-mac { fill: #26243A; stroke: #A9A4C8; }
.b-ext { fill: #1C2421; stroke: #7D8B85; }
.b-cmp { fill: #171F1C; stroke: #7D8B85; }
.b-later { stroke: #7D8B85; }
.bound { stroke: #4A5752; }
.head { fill: #8EB4D8; }
.t-name, .t-code { fill: #E6ECE9; }
.t-type, .t-bound, .t-leg { fill: #93A09A; }
.t-desc { fill: #C3CDC8; }
.t-rel { fill: #93A09A; stroke: #171F1C; }
.edge, .edge-later { stroke: #7D8B85; }
.arrowhead { fill: #7D8B85; }
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" x="0" y="0" width="1000" height="840"/>
<rect class="bound" x="16" y="40" width="968" height="520" rx="12"/>
<text class="t-bound" x="32" y="62">mcl-embedder [Container]</text>
<rect class="b-cmp" x="32" y="70" width="290" height="120" rx="10"/>
<text class="t-code" x="48" y="98">mcl_embedder_app</text>
<text class="t-type" x="48" y="116">[OTP application]</text>
<text class="t-desc" x="48" y="140">Application entry: start/2 calls</text>
<text class="t-desc" x="48" y="156">mcl_om:boot/1 with this service</text>
<text class="t-desc" x="48" y="172">module, which wires the mesh</text>
<rect class="b-cmp" x="346" y="70" width="290" height="120" rx="10"/>
<text class="t-code" x="362" y="98">mcl_embedder_service</text>
<text class="t-type" x="362" y="116">[mcl_om_service behaviour]</text>
<text class="t-desc" x="362" y="140">The six mcl_om_service callbacks,</text>
<text class="t-desc" x="362" y="156">resolved by name. mcl-om adds the open</text>
<text class="t-desc" x="362" y="172">info and get_limits beside them.</text>
<rect class="b-cmp" x="660" y="70" width="308" height="120" rx="10"/>
<text class="t-code" x="676" y="98">mcl_embedder_sup</text>
<text class="t-type" x="676" y="116">[supervisor, one_for_one]</text>
<text class="t-desc" x="676" y="140">No children: the handler is started</text>
<text class="t-desc" x="676" y="156">by mcl-om's capability registration,</text>
<text class="t-desc" x="676" y="172">so the empty list is the honest shape</text>
<rect class="b-sys" x="32" y="222" width="290" height="152" rx="10"/>
<text class="t-code" x="48" y="250">serve_embed</text>
<text class="t-type" x="48" y="268">[macula_response handler]</text>
<text class="t-desc" x="48" y="292">handle_request/2: one text returns</text>
<text class="t-desc" x="48" y="308">a vector, a list of texts a list of</text>
<text class="t-desc" x="48" y="324">vectors. kind query or passage</text>
<text class="t-desc" x="48" y="340">applies the e5 prefix; no text at</text>
<text class="t-desc" x="48" y="356">all is refused as bad_request</text>
<rect class="b-mac" x="346" y="222" width="290" height="152" rx="10"/>
<text class="t-code" x="362" y="250">mcl_om</text>
<text class="t-type" x="362" y="268">[library, ~&gt; 1.4]</text>
<text class="t-desc" x="362" y="292">boot/1: the node identity key,</text>
<text class="t-desc" x="362" y="308">realm admission, a mesh pool, the</text>
<text class="t-desc" x="362" y="324">capability registration and /health</text>
<text class="t-desc" x="362" y="340">on MCL_HEALTH_PORT. Adds the open</text>
<text class="t-desc" x="362" y="356">Org/info and Org/get_limits</text>
<rect class="b-mac" x="660" y="222" width="308" height="152" rx="10"/>
<text class="t-code" x="676" y="250">macula SDK</text>
<text class="t-type" x="676" y="268">[library, ~&gt; 16.0, wire 1.0]</text>
<text class="t-desc" x="676" y="292">QUIC transport, the PQ handshake,</text>
<text class="t-desc" x="676" y="308">RPC dispatch to a handler by name,</text>
<text class="t-desc" x="676" y="324">and the signed records the mesh DHT</text>
<text class="t-desc" x="676" y="340">holds</text>
<rect class="b-mac" x="32" y="420" width="624" height="120" rx="10"/>
<text class="t-code" x="48" y="448">mcl_embed</text>
<text class="t-type" x="48" y="466">[library, ~&gt; 0.1.1, Rust NIF over ONNX]</text>
<text class="t-desc" x="48" y="490">embed/2, embed_query/2, embed_passage/2, embed_many/2 and default_model/0, over</text>
<text class="t-desc" x="48" y="506">fastembed: multilingual-e5-small, 384 dimensions, loaded lazily on the first call.</text>
<text class="t-desc" x="48" y="522">The image builds the real backend with CARGO_FEATURES=real-embed; tests use a stub</text>
<rect class="b-ext" x="660" y="420" width="308" height="120" rx="10"/>
<text class="t-name" x="676" y="448">AVX2 host</text>
<text class="t-type" x="676" y="466">[Host requirement]</text>
<text class="t-desc" x="676" y="490">The ONNX Runtime SIGILLs on a CPU</text>
<text class="t-desc" x="676" y="506">without AVX2, so the box running</text>
<text class="t-desc" x="676" y="522">this image must have it</text>
<rect class="b-ext" x="40" y="620" width="920" height="120" rx="10"/>
<text class="t-name" x="56" y="648">Deploy environment</text>
<text class="t-type" x="56" y="666">[environment, from the host or the compose file]</text>
<text class="t-desc" x="56" y="690">MCL_REALM and MCL_REALM_KEY admit the node; MACULA_STATION_SEEDS and MACULA_STATION_NODE_IDS</text>
<text class="t-desc" x="56" y="706">are the pinned dial; MCL_HEALTH_PORT is 8480; MCL_SERVICE_NAME and MCL_BOX label the claim. mcl_embed</text>
<text class="t-desc" x="56" y="722">reads MCL_EMBED_MODEL_DIR (/models) on the first call. The identity key lives on the named volume /etc/mcl/secrets</text>
<path class="edge" d="M322 110H346" marker-end="url(#a)"/>
<text class="t-rel" x="334" y="102" text-anchor="middle">boots</text>
<path class="edge" d="M636 130H660" marker-end="url(#a)"/>
<text class="t-rel" x="648" y="122" text-anchor="middle">starts</text>
<path class="edge" d="M346 150H334V290H322" marker-end="url(#a)"/>
<text class="t-rel" x="340" y="220" text-anchor="middle" transform="rotate(-90 340 220)">declares in capabilities/0</text>
<path class="edge" d="M300 222V200H644V300H660" marker-end="url(#a)"/>
<text class="t-rel" x="590" y="212" text-anchor="middle">replies through</text>
<path class="edge" d="M180 374V420" marker-end="url(#a)"/>
<text class="t-rel" x="188" y="414">embeds with</text>
<path class="edge" d="M340 620V540" marker-end="url(#a)"/>
<text class="t-rel" x="348" y="576">MCL_EMBED_MODEL_DIR,</text>
<text class="t-rel" x="348" y="592">read on the first call</text>
<path class="edge" d="M40 666H24V400H500V374" marker-end="url(#a)"/>
<text class="t-rel" x="300" y="394">read at boot</text>
<text class="t-desc" x="40" y="752">config/sys.config.src fixes the org, mcl-embedder, which prefixes procedure names, and pins the</text>
<text class="t-desc" x="40" y="770">realm key: a boot with a malformed term is refused. The model loads on the first call, so</text>
<text class="t-desc" x="40" y="788">/health never probes it, and deploy/docker-compose.yml runs the container on the host network.</text>
<rect class="b-sys" x="24" y="806" width="22" height="14" rx="3"/>
<text class="t-leg" x="54" y="818">In scope</text>
<rect class="b-per" x="110.8" y="806" width="22" height="14" rx="3"/>
<text class="t-leg" x="140.8" y="818">Person</text>
<rect class="b-mac" x="184.39999999999998" y="806" width="22" height="14" rx="3"/>
<text class="t-leg" x="214.39999999999998" y="818">Macula infrastructure</text>
<rect class="b-ext" x="357.0" y="806" width="22" height="14" rx="3"/>
<text class="t-leg" x="387.0" y="818">External system</text>
<rect class="b-cmp" x="490.0" y="806" width="22" height="14" rx="3"/>
<text class="t-leg" x="520.0" y="818">Container or component</text>
<rect class="bound" x="669.2" y="806" width="22" height="14" rx="3"/>
<text class="t-leg" x="699.2" y="818">Boundary</text>
</svg>
